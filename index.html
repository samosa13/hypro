<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff6a00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS / iPhone (preparado para Fase 3): instalación desde Safari con
         Compartir → "Añadir a pantalla de inicio". El código ya degrada las
         capacidades no soportadas en iOS (push, background sync, audio). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hypro" />
    <link rel="apple-touch-icon" href="/hypro/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/hypro/icons/icon-512.png" />
    <title>Hypro</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Banner de instalación propio (como VendIX): aparece cuando el navegador
         permite instalar. El usuario pulsa "Instalar" y acepta el prompt nativo. -->
    <div id="install-banner" class="install-banner hidden">
      <span class="install-text">📲 Instala Hypro en tu móvil</span>
      <button id="install-btn" class="install-yes">Instalar</button>
      <button id="install-dismiss" class="install-no" aria-label="Cerrar">✕</button>
    </div>

    <!-- Aviso de actualización: aparece cuando hay una versión nueva desplegada. -->
    <div id="update-banner" class="install-banner update hidden">
      <span class="install-text">🔄 Hay una versión nueva de Hypro</span>
      <button id="update-btn" class="install-yes">Actualizar</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
